version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # fix(deps) releases a patch; chore(dev-deps) releases nothing.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
