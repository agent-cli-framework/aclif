# Publishing a GitHub release publishes the package to npm through trusted
# publishing (OIDC). No npm token: npm trusts this repository and this
# workflow file, configured once in the package's settings on npmjs.com.
# Provenance is attested automatically. The dist-tag is the prerelease
# identifier of the version (beta, dev) or latest.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [[ "v$v" == "${{ inputs.tag || github.event.release.tag_name }}" ]] || { echo "package.json is $v, tag is ${{ inputs.tag || github.event.release.tag_name }}"; exit 1; }
      - name: npm 11.5.1 or later, required for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: publish
        run: |
          v=$(node -p "require('./package.json').version")
          tag=latest
          if [[ "$v" == *-* ]]; then tag="${v#*-}"; tag="${tag%%.*}"; fi
          # prepack rebuilds lib/ and writes the oclif manifest. Provenance is
          # automatic under trusted publishing; no --provenance flag needed.
          npm publish --access public --tag "$tag"
